<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Center - Predictions & Odds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f172a; background-image: radial-gradient(circle at top right, #1e293b, #0f172a); min-height: 100vh; }
        .animate-pulse-fast { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="text-slate-200 p-4 md:p-10 font-sans">
    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 mb-2 italic tracking-tighter">MATCH CENTER</h1>
            <p class="text-slate-500 font-bold uppercase tracking-[0.3em] text-[10px]">Real-time Schedule & Odds Analysis</p>
        </header>

        <div id="match-list" class="grid gap-8 md:grid-cols-2">
            </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadMatches() {
            const { data } = await _supabase.from('jadwal_bola').select('*').order('id', { ascending: false });
            const container = document.getElementById('match-list');
            
            container.innerHTML = data.map(item => {
                const statusHTML = item.status === 'LIVE' 
                    ? `<span class="bg-red-500 text-white animate-pulse-fast px-3 py-1 rounded-full text-[9px] font-black italic">LIVE NOW</span>`
                    : `<span class="bg-slate-700 text-slate-300 px-3 py-1 rounded-full text-[9px] font-black uppercase">${item.status || 'UPCOMING'}</span>`;

                const logoA = item.logo_a || 'https://via.placeholder.com/100?text=TIM+A';
                const logoB = item.logo_b || 'https://via.placeholder.com/100?text=TIM+B';

                if (item.tipe_kartu === 'ODDS') {
                    // KARTU JADWAL & ODDS
                    return `
                    <div class="glass p-6 rounded-[2.5rem] shadow-2xl hover:border-blue-500/50 transition-all duration-500 group">
                        <div class="flex justify-between items-center mb-6">
                            ${statusHTML}
                            <div class="text-right">
                                <div class="text-blue-400 text-[10px] font-black uppercase tracking-widest">${item.liga}</div>
                                <div class="text-slate-500 text-[11px] font-bold">📅 ${item.tanggal} | 🕒 ${item.jam}</div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between gap-4 mb-8">
                            <div class="text-center flex-1">
                                <img src="${logoA}" class="w-16 h-16 mx-auto mb-3 rounded-full border-2 border-slate-700 bg-slate-900 p-1 group-hover:scale-110 transition-transform shadow-xl">
                                <div class="text-sm font-black uppercase tracking-tight">${item.tim_a}</div>
                            </div>
                            <div class="text-3xl font-black italic text-slate-700">VS</div>
                            <div class="text-center flex-1">
                                <img src="${logoB}" class="w-16 h-16 mx-auto mb-3 rounded-full border-2 border-slate-700 bg-slate-900 p-1 group-hover:scale-110 transition-transform shadow-xl">
                                <div class="text-sm font-black uppercase tracking-tight">${item.tim_b}</div>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-3">
                            <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-700/50 text-center">
                                <div class="text-[9px] text-blue-400 font-black uppercase mb-1">Home</div>
                                <div class="text-xl font-mono font-black text-white">${item.odds_home || '0.0'}</div>
                            </div>
                            <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-700/50 text-center">
                                <div class="text-[9px] text-slate-500 font-black uppercase mb-1">Draw</div>
                                <div class="text-xl font-mono font-black text-white">${item.odds_draw || '0.0'}</div>
                            </div>
                            <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-700/50 text-center">
                                <div class="text-[9px] text-red-400 font-black uppercase mb-1">Away</div>
                                <div class="text-xl font-mono font-black text-white">${item.odds_away || '0.0'}</div>
                            </div>
                        </div>
                    </div>`;
                } else {
                    // KARTU PREDIKSI SKOR
                    return `
                    <div class="glass p-6 rounded-[2.5rem] border-l-8 border-l-green-500/50">
                        <div class="flex justify-between items-center mb-6">
                            <span class="bg-green-500/20 text-green-400 px-4 py-1 rounded-full text-[9px] font-black tracking-widest uppercase">Expert Prediction</span>
                            <div class="text-right">
                                <div class="text-slate-500 text-[11px] font-bold">📅 ${item.tanggal} | 🕒 ${item.jam}</div>
                            </div>
                        </div>
                        <div class="text-center mb-6">
                            <div class="text-xl font-black uppercase tracking-tighter mb-2">${item.tim_a} <span class="text-blue-500 italic">v</span> ${item.tim_b}</div>
                            <div class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">${item.liga}</div>
                        </div>
                        <div class="bg-gradient-to-br from-slate-900 to-black p-5 rounded-3xl text-center border border-slate-800 shadow-inner">
                            <div class="text-[10px] text-slate-600 font-black uppercase mb-1">Predicted Full-Time Score</div>
                            <div class="text-4xl font-mono font-black text-green-400 tracking-tighter">${item.prediksi}</div>
                        </div>
                        <button onclick="copyText('${item.tim_a} vs ${item.tim_b} | Skor: ${item.prediksi}')" class="w-full mt-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-[10px] font-bold text-slate-400 transition-all">📋 COPY PREDICTION</button>
                    </div>`;
                }
            }).join('');
        }

        function copyText(txt) { navigator.clipboard.writeText(txt); alert("✅ Copied!"); }

        loadMatches();
        _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'jadwal_bola' }, () => loadMatches()).subscribe();
    </script>
</body>
</html>
