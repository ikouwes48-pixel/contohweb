<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIMERLA — Premium Football Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass-table { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .hero-gradient { background: linear-gradient(to bottom, rgba(2,6,23,0.3), #020617); }
        .slider-img { transition: opacity 1s ease-in-out; }
    </style>
</head>
<body>

<nav class="fixed w-full z-50 bg-slate-950/80 backdrop-blur-lg border-b border-white/5 px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="text-2xl font-extrabold tracking-tighter italic">DIMERLA<span class="text-sky-500">.</span></div>
        <a href="https://www.dimastoremedan.com/" class="bg-sky-600 hover:bg-sky-500 text-white px-6 py-2 rounded-full text-xs font-bold transition-all shadow-lg shadow-sky-500/20">VISIT STORE</a>
    </div>
</nav>

<section class="relative h-[500px] overflow-hidden flex items-center justify-center">
    <div id="slider-container" class="absolute inset-0 z-0">
        <img id="slider-img" src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=1600&q=80" class="w-full h-full object-cover slider-img">
    </div>
    <div class="absolute inset-0 hero-gradient z-10"></div>
    
    <div class="relative z-20 text-center px-6 mt-16">
        <h1 class="text-5xl md:text-7xl font-black uppercase tracking-tighter leading-none mb-4">Elite <span class="text-sky-500">Analysis</span></h1>
        <p class="text-slate-400 text-lg max-w-2xl mx-auto font-medium italic">Prediksi Handicap & Over/Under Terakurat Setiap Hari.</p>
    </div>
</section>

<main class="max-w-7xl mx-auto px-6 py-12">
    <div class="flex items-center gap-3 mb-10">
        <div class="w-2 h-8 bg-sky-500 rounded-full"></div>
        <h2 class="text-2xl font-extrabold uppercase italic">Latest Fixtures</h2>
    </div>

    <div id="matches-container" class="space-y-8">
        <div class="text-center py-20 animate-pulse text-slate-500 font-bold uppercase tracking-widest text-sm">Synchronizing Live Data...</div>
    </div>
</main>

<footer class="py-12 border-t border-white/5 text-center text-slate-600 text-[10px] font-bold uppercase tracking-widest">
    © 2026 DIMERLA GLOBAL MEDIA. ALL RIGHTS RESERVED.
</footer>

<script>
    // 1. AUTO SLIDER LOGIC
    const images = [
        "https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=1600&q=80",
        "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=1600&q=80",
        "https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=1600&q=80"
    ];
    let currentIdx = 0;
    setInterval(() => {
        currentIdx = (currentIdx + 1) % images.length;
        document.getElementById('slider-img').src = images[currentIdx];
    }, 5000);

    // 2. SUPABASE LOGIC
    const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadMatches() {
        const { data } = await _supabase.from('jadwal_bola').select('*').order('id', { ascending: false });
        const container = document.getElementById('matches-container');
        container.innerHTML = "";

        data.forEach(m => {
            container.innerHTML += `
            <div class="glass-table rounded-[2.5rem] overflow-hidden group hover:border-sky-500/30 transition-all shadow-2xl">
                <div class="bg-slate-900/80 px-8 py-4 flex justify-between items-center border-b border-white/5">
                    <span class="text-xs font-black text-sky-500 tracking-tighter uppercase italic">${m.liga}</span>
                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">${m.tanggal} | ${m.jam} WIB</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="text-[9px] text-slate-500 uppercase font-black border-b border-white/5">
                            <tr>
                                <th class="p-6 text-left w-1/4">Teams</th>
                                <th class="p-6 text-center bg-white/[0.02]">Asian Handicap</th>
                                <th class="p-6 text-center">Over / Under</th>
                                <th class="p-6 text-center">Prediction</th>
                            </tr>
                        </thead>
                        <tbody class="text-white">
                            <tr>
                                <td class="p-6 min-w-[200px]">
                                    <div class="space-y-3 font-extrabold text-lg italic tracking-tighter">
                                        <div>${m.tim_a}</div>
                                        <div class="text-slate-700 text-xs font-normal">VS</div>
                                        <div>${m.tim_b}</div>
                                    </div>
                                </td>
                                <td class="p-6 bg-white/[0.02] min-w-[220px]">
                                    <div class="flex justify-between items-center px-4">
                                        <span class="text-sky-400 font-black text-xl">${m.hdp_home || '0.0'}</span>
                                        <div class="bg-slate-800 px-3 py-1.5 rounded-xl border border-white/10 text-[11px] font-black">${m.hdp_value || '0:0'}</div>
                                        <span class="text-sky-400 font-black text-xl">${m.hdp_away || '0.0'}</span>
                                    </div>
                                </td>
                                <td class="p-6 min-w-[220px]">
                                    <div class="flex justify-between items-center px-4">
                                        <span class="text-amber-500 font-black text-xl">${m.ou_over || '0.0'}</span>
                                        <div class="text-center">
                                            <div class="text-[8px] text-slate-500 uppercase font-bold">Total</div>
                                            <div class="font-black text-white">${m.ou_total || '0'}</div>
                                        </div>
                                        <span class="text-amber-500 font-black text-xl">${m.ou_under || '0.0'}</span>
                                    </div>
                                </td>
                                <td class="p-6 text-center">
                                    <div class="inline-block bg-sky-500/10 border border-sky-500/30 px-6 py-3 rounded-2xl">
                                        <div class="text-[8px] text-sky-500 font-black uppercase mb-1">Final Score Tip</div>
                                        <div class="text-2xl font-black italic tracking-tighter text-white">${m.prediksi || '?-?'}</div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <a href="https://www.dimastoremedan.com/" class="block py-4 bg-sky-600/5 hover:bg-sky-600 text-sky-500 hover:text-white text-center text-[10px] font-black uppercase tracking-[0.2em] transition-all">
                    Get VIP Analysis & Odds Comparison
                </a>
            </div>`;
        });
    }
    loadMatches();
</script>
</body>
</html>
