<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Bola Pro - Live Update</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f172a; background-image: radial-gradient(circle at top right, #1e293b, #0f172a); min-height: 100vh; }
        .animate-pulse-fast { animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    </style>
</head>
<body class="text-slate-200 p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">FOOTBALL PREDICTION</h1>
            <p class="text-slate-400 font-medium">Update Otomatis & Analisis Skor Terkini</p>
        </header>

        <div id="match-list" class="grid gap-6"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function tampilkanData() {
            const { data } = await _supabase.from('jadwal_bola').select('*').order('id', { ascending: false });
            const container = document.getElementById('match-list');
            
            container.innerHTML = data.map(item => {
                const statusColor = item.status === 'LIVE' ? 'bg-red-500 text-white animate-pulse-fast' : 'bg-cyan-500/10 text-cyan-400';
                const logo = item.logo_url || 'https://via.placeholder.com/50?text=FC'; // Default logo jika kosong

                return `
                <div class="bg-slate-800/50 border border-slate-700 p-6 rounded-2xl backdrop-blur-sm hover:border-cyan-500/50 transition-all">
                    <div class="flex justify-between items-center mb-4">
                        <span class="px-3 py-1 ${statusColor} text-[10px] font-bold rounded-full uppercase">${item.status || 'UPCOMING'}</span>
                        <span class="text-slate-500 text-sm italic">🕒 ${item.jam}</span>
                    </div>
                    <div class="flex items-center justify-around text-center gap-4">
                        <div class="flex-1">
                            <img src="${logo}" class="w-12 h-12 mx-auto mb-2 rounded-full border border-slate-600 p-1 bg-white/5 shadow-lg">
                            <div class="font-bold text-lg">${item.tim_a}</div>
                        </div>
                        <div class="font-black text-2xl text-cyan-500 italic">VS</div>
                        <div class="flex-1">
                            <img src="${logo}" class="w-12 h-12 mx-auto mb-2 rounded-full border border-slate-600 p-1 bg-white/5 shadow-lg">
                            <div class="font-bold text-lg">${item.tim_b}</div>
                        </div>
                    </div>
                    <div class="mt-6 pt-4 border-t border-slate-700/50 flex justify-between items-center">
                        <button onclick="copyText('${item.tim_a} vs ${item.tim_b} - Prediksi: ${item.prediksi}')" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-slate-300 transition-all">📋 Salin Prediksi</button>
                        <span class="text-xl font-mono font-bold text-green-400 bg-green-400/10 px-4 py-1 rounded-lg">${item.prediksi}</span>
                    </div>
                </div>`;
            }).join('');
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt);
            alert("Prediksi berhasil disalin!");
        }

        tampilkanData();
        _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'jadwal_bola' }, () => tampilkanData()).subscribe();
    </script>
</body>
</html>
