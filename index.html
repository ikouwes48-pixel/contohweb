<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bola Pro - Schedule & Odds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f172a; min-height: 100vh; font-family: sans-serif; }
        .card-odds { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid #334155; }
    </style>
</head>
<body class="text-slate-200 p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <header class="mb-10 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-black text-cyan-500 italic">MATCH CENTER</h1>
                <p class="text-slate-400 text-xs font-bold uppercase">Schedule & Professional Odds</p>
            </div>
            <div id="clock" class="text-slate-500 font-mono text-sm"></div>
        </header>

        <div id="match-container" class="grid gap-8 md:grid-cols-2 lg:grid-cols-2">
            </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadMatches() {
            const { data } = await _supabase.from('jadwal_bola').select('*').order('id', { ascending: false });
            const container = document.getElementById('match-container');
            
            container.innerHTML = data.map(item => {
                if (item.tipe_kartu === 'ODDS') {
                    // TAMPILAN KARTU JADWAL & ODDS
                    return `
                    <div class="card-odds p-6 rounded-3xl shadow-2xl relative overflow-hidden">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-[10px] font-black text-cyan-400 uppercase tracking-widest">${item.liga}</span>
                            <span class="text-slate-500 text-[10px] font-bold">📅 ${item.tanggal}</span>
                        </div>
                        <div class="flex items-center justify-between gap-4 mb-6">
                            <div class="text-center flex-1">
                                <img src="${item.logo_a}" class="w-12 h-12 mx-auto mb-2 rounded-full border border-slate-700 bg-slate-800 p-1">
                                <div class="text-xs font-bold uppercase">${item.tim_a}</div>
                            </div>
                            <div class="text-slate-600 font-black italic text-xl">VS</div>
                            <div class="text-center flex-1">
                                <img src="${item.logo_b}" class="w-12 h-12 mx-auto mb-2 rounded-full border border-slate-700 bg-slate-800 p-1">
                                <div class="text-xs font-bold uppercase">${item.tim_b}</div>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 mt-4">
                            <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 text-center">
                                <div class="text-[9px] text-slate-500 font-bold uppercase mb-1 text-blue-400">Home</div>
                                <div class="text-lg font-black text-white">${item.odds_home || '0.0'}</div>
                            </div>
                            <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 text-center">
                                <div class="text-[9px] text-slate-500 font-bold uppercase mb-1">Draw</div>
                                <div class="text-lg font-black text-white">${item.odds_draw || '0.0'}</div>
                            </div>
                            <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 text-center">
                                <div class="text-[9px] text-slate-500 font-bold uppercase mb-1 text-red-400">Away</div>
                                <div class="text-lg font-black text-white">${item.odds_away || '0.0'}</div>
                            </div>
                        </div>
                        <div class="mt-4 text-center text-[10px] font-bold text-slate-600">Kick Off: ${item.jam}</div>
                    </div>`;
                } else {
                    // TAMPILAN KARTU PREDIKSI (Sama seperti sebelumnya)
                    return `
                    <div class="bg-slate-800/40 border border-slate-700 p-6 rounded-3xl">
                        <div class="flex justify-between mb-4">
                            <span class="px-3 py-1 bg-green-500/10 text-green-400 text-[9px] font-bold rounded-full">PREDICTION</span>
                            <span class="text-slate-500 text-[10px] font-bold">${item.jam}</span>
                        </div>
                        <div class="text-center font-black text-lg mb-4 uppercase">${item.tim_a} <span class="text-cyan-500">vs</span> ${item.tim_b}</div>
                        <div class="bg-slate-900/50 p-4 rounded-2xl text-center border border-slate-700">
                            <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">Expert Score</div>
                            <div class="text-3xl font-mono font-black text-green-400">${item.prediksi}</div>
                        </div>
                    </div>`;
                }
            }).join('');
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        loadMatches();
        _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'jadwal_bola' }, () => loadMatches()).subscribe();
    </script>
</body>
</html>
