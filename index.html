<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIMERLA — Elite Sport Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.05); }

            background: linear-gradient(rgba(15,23,42,0.9), rgba(15,23,42,0.9)), url('https://images.unsplash.com/photo-1522778119026-d647f0596c20?q=80&w=1000');
            background-size: cover; background-position: center;
        }
    </style>
</head>
<body>

<nav class="sticky top-0 z-50 bg-slate-900/90 border-b border-slate-800 p-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <div class="text-2xl font-black italic tracking-tighter text-white">DIMERLA<span class="text-sky-500">.</span></div>

<header class="bg-stadium py-16 px-6 text-center">

    <p class="text-slate-400 text-sm max-w-xl mx-auto italic">Data handicap dan over/under diperbarui secara real-time berdasarkan bursa internasional.</p>
</header>

<main class="max-w-6xl mx-auto px-4 py-12">
    <div id="matches-container" class="grid grid-cols-1 gap-6">
        </div>
</main>

<script>
    const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function renderData() {
        const { data } = await _supabase.from('jadwal_bola').select('*').order('id', { ascending: false });
        const container = document.getElementById("matches-container");
        container.innerHTML = "";

        data.forEach(m => {
            const logoA = m.logo_url || 'https://via.placeholder.com/100'; // Default logo
            const isLive = m.status === 'LIVE';

            container.innerHTML += `
            <div class="glass-card rounded-3xl overflow-hidden">
                <div class="bg-slate-800/50 px-6 py-3 border-b border-slate-700 flex justify-between items-center">
                    <span class="text-[10px] font-black text-sky-400 tracking-widest uppercase">${m.liga}</span>
                    <span class="text-[10px] text-slate-500 font-bold uppercase">${m.tanggal} @ ${m.jam} WIB</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="text-[10px] text-slate-500 uppercase border-b border-slate-800">

                                        <span>${m.tim_b}</span>
                                    </div>
                                </td>

                                        <span class="bg-slate-700 text-[10px] px-2 py-1 rounded-md text-white font-black">${m.hdp_value || '0 : 0'}</span>

                                        ${m.prediksi || 'TBA'}
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <a href="https://www.dimastoremedan.com/" class="block w-full py-3 bg-sky-600/5 hover:bg-sky-600 hover:text-white text-center text-[10px] font-black uppercase tracking-widest transition-all">
                    Detail Match Analysis & Tips
                </a>
            </div>`;
        });
    }
    renderData();
    _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'jadwal_bola' }, () => renderData()).subscribe();
</script>
</body>
</html>
