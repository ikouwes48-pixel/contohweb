<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIMERLA | Premium Store Medan</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f8f9fa; color: #0d1b2a; }
        :root { --g1: #0a7c5c; --g2: #0fa876; }
        .prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 20px 0; }
        .prod-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #e8edf2; transition: all 0.3s; position: relative; }
        .prod-card:hover { transform: translateY(-5px); shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .prod-img { aspect-ratio: 1; overflow: hidden; background: #f0f4f3; }
        .prod-img img { width: 100%; height: 100%; object-fit: cover; }
        .prod-tag { position: absolute; top: 10px; left: 10px; padding: 4px 10px; font-size: 10px; font-weight: 800; border-radius: 5px; color: white; }
        .tag-new { background: var(--g1); }
        .tag-sold { background: #64748b; }
        .prod-info { padding: 15px; }
        .prod-name { font-size: 14px; font-weight: 700; margin-bottom: 8px; height: 40px; overflow: hidden; }
        .prod-price { font-size: 16px; font-weight: 900; color: #e53e3e; }
        .stok-bar { height: 4px; background: #eee; border-radius: 2px; margin-top: 5px; overflow: hidden; }
        .stok-fill { height: 100%; background: var(--g1); transition: width 0.5s; }
        .btn-buy { width: 35px; height: 35px; background: var(--g1); color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .btn-buy:disabled { background: #cbd5e1; cursor: not-allowed; }
    </style>
</head>
<body>

    <nav class="sticky top-0 z-50 bg-white border-b px-6 py-4 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="text-2xl font-black italic text-[#0d1b2a]">DIMERLA<span class="text-[#0a7c5c]">.</span></div>
            <div class="hidden md:flex gap-6 text-xs font-bold uppercase tracking-widest text-slate-500">
                <a href="#home" class="hover:text-[#0a7c5c]">Beranda</a>
                <a href="#products" class="hover:text-[#0a7c5c]">Katalog</a>
                <a href="/admin.html" class="text-[#0a7c5c]">Panel Admin</a>
            </div>
            <a href="https://wa.me/6281334331776" class="bg-[#0a7c5c] text-white px-5 py-2 rounded-full text-xs font-bold">KONSULTASI</a>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-6 py-12">
        <div class="bg-[#0d1b2a] rounded-[2.5rem] p-10 md:p-20 text-white relative overflow-hidden">
            <div class="relative z-10">
                <span class="bg-[#0a7c5c]/20 text-[#0fa876] px-4 py-1 rounded-full text-[10px] font-black tracking-widest uppercase">Premium Store Medan</span>
                <h1 class="text-4xl md:text-6xl font-black mt-4 leading-tight">Gaya Mewah,<br>Harga <span class="text-[#0fa876]">Ramah.</span></h1>
                <p class="text-slate-400 mt-4 max-w-md text-sm leading-relaxed">Pusat fashion, aksesoris, dan elektronik premium di Medan. Pengiriman cepat & amanah.</p>
                <div class="mt-8 flex gap-4">
                    <a href="#products" class="bg-[#0fa876] text-[#0d1b2a] px-8 py-4 rounded-xl font-black text-xs uppercase tracking-widest">Belanja Sekarang</a>
                </div>
            </div>
            <div class="absolute top-0 right-0 w-1/2 h-full opacity-20 hidden md:block">
                <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800" class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10" id="products">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-2xl font-black italic uppercase">New Arrivals</h2>
        </div>

        <div id="main-grid" class="prod-grid">
            <div class="col-span-full text-center py-20 opacity-30 font-bold uppercase tracking-widest">Menghubungkan ke Database...</div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadData() {
            const { data, error } = await _supabase.from('produk_dimastore').select('*').order('id', { ascending: false });
            const grid = document.getElementById('main-grid');
            
            if (error) { grid.innerHTML = "Gagal memuat data."; return; }
            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center">
                    <p class="text-slate-400 font-bold italic uppercase tracking-widest">Katalog Masih Kosong</p>
                    <p class="text-xs text-slate-300 mt-2">Silakan tambahkan produk melalui Admin Panel.</p>
                </div>`;
                return;
            }

            grid.innerHTML = "";
            data.forEach(p => {
                const isOut = p.stok <= 0;
                const harga = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(p.harga);
                
                grid.innerHTML += `
                <div class="prod-card shadow-sm border border-slate-100">
                    <div class="prod-img">
                        <img src="${p.gambar_url}" alt="${p.nama_produk}">
                        <span class="prod-tag ${isOut ? 'tag-sold' : 'tag-new'}">${isOut ? 'HABIS' : p.kategori}</span>
                    </div>
                    <div class="prod-info">
                        <h3 class="prod-name">${p.nama_produk}</h3>
                        <div class="flex justify-between items-end">
                            <div>
                                <span class="prod-price">${harga}</span>
                                <div class="text-[9px] font-bold text-slate-400 mt-2 uppercase tracking-tighter">Stok: ${p.stok}</div>
                                <div class="stok-bar w-20"><div class="stok-fill" style="width: ${Math.min(p.stok*10, 100)}%"></div></div>
                            </div>
                            <button onclick="window.open('${p.link_wa}')" class="btn-buy" ${isOut ? 'disabled' : ''}>+</button>
                        </div>
                    </div>
                </div>`;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'produk_dimastore' }, loadData).subscribe();
        });
    </script>
</body>
</html>
