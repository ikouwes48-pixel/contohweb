<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Bola Pro - Live Update</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f172a; background-image: radial-gradient(circle at top right, #1e293b, #0f172a); min-height: 100vh; }
        .animate-pulse-fast { animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    </style>
</head>
<body class="text-slate-200 p-4 md:p-8 font-sans">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2 italic">FOOTBALL PREDICTION</h1>
            <p class="text-slate-400 font-medium font-mono uppercase tracking-[0.2em] text-[10px]">Global Match Analysis</p>
        </header>

        <div id="match-list" class="grid gap-6">
            </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function tampilkanData() {
            const { data, error } = await _supabase.from('jadwal_bola').select('*').order('id', { ascending: false });
            if (error) return;

            const container = document.getElementById('match-list');
            if (data.length === 0) {
                container.innerHTML = '<div class="text-center p-10 bg-slate-800/30 rounded-2xl border border-dashed border-slate-700 text-slate-500 font-mono">NO ACTIVE MATCHES</div>';
                return;
            }

            container.innerHTML = data.map(item => {
                const statusColor = item.status === 'LIVE' ? 'bg-red-500 text-white animate-pulse-fast' : 'bg-slate-700 text-slate-300';
                const imgA = item.logo_a || 'https://via.placeholder.com/100?text=?';
                const imgB = item.logo_b || 'https://via.placeholder.com/100?text=?';

                return `
                <div class="bg-slate-800/40 border border-slate-700/50 p-6 rounded-3xl backdrop-blur-md hover:border-blue-500/50 transition-all duration-500">
                    <div class="flex justify-between items-start mb-6">
                        <span class="px-4 py-1.5 ${statusColor} text-[9px] font-black rounded-full uppercase tracking-widest shadow-lg">${item.status || 'UPCOMING'}</span>
                        <div class="text-right">
                            <div class="text-blue-400 text-[10px] font-black uppercase tracking-widest mb-1">${item.liga}</div>
                            <div class="text-slate-400 text-[11px] font-bold"><span class="text-slate-600">📅</span> ${item.tanggal || '-'} | <span class="text-slate-600">🕒</span> ${item.jam}</div>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between text-center gap-2">
                        <div class="flex-1">
                            <div class="relative inline-block mb-3">
                                <img src="${imgA}" class="w-16 h-16 md:w-20 md:h-20 mx-auto rounded-full border-2 border-slate-700 p-1 bg-slate-900 shadow-2xl transition-transform hover:scale-110">
                            </div>
                            <div class="font-black text-xs md:text-sm uppercase tracking-tight text-slate-100">${item.tim_a}</div>
                        </div>
                        
                        <div class="flex flex-col items-center">
                            <div class="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-b from-blue-400 to-blue-600 italic">VS</div>
                        </div>

                        <div class="flex-1">
                            <div class="relative inline-block mb-3">
                                <img src="${imgB}" class="w-16 h-16 md:w-20 md:h-20 mx-auto rounded-full border-2 border-slate-700 p-1 bg-slate-900 shadow-2xl transition-transform hover:scale-110">
                            </div>
                            <div class="font-black text-xs md:text-sm uppercase tracking-tight text-slate-100">${item.tim_b}</div>
                        </div>
                    </div>

                    <div class="mt-8 pt-5 border-t border-slate-700/30 flex justify-between items-center">
                        <button onclick="copyText('${item.tim_a} vs ${item.tim_b} | Prediksi: ${item.prediksi}')" class="group relative px-4 py-2 bg-slate-700/50 hover:bg-slate-600 rounded-xl text-[10px] font-bold text-slate-300 transition-all active:scale-95">
                           📋 COPY
                        </button>
                        <div class="text-right">
                            <div class="text-[9px] text-slate-500 font-black uppercase mb-1">Expert Prediction</div>
                            <div class="text-2xl font-mono font-black text-green-400 tracking-tighter">${item.prediksi}</div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt);
            alert("Prediksi Berhasil Disalin!");
        }

        tampilkanData();
        _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'jadwal_bola' }, () => tampilkanData()).subscribe();
    </script>
</body>
</html>
