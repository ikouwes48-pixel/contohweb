<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin DIMERLA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-200 p-8 font-sans">
    <div class="max-w-2xl mx-auto bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-black text-sky-500 mb-6 italic uppercase">Add New Analysis</h1>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
            <input type="text" id="liga" placeholder="LIGA (Premier League)" class="col-span-2 p-4 bg-slate-700 rounded-2xl outline-none">
            <input type="text" id="tim_a" placeholder="HOME TEAM" class="p-4 bg-slate-700 rounded-2xl outline-none">
            <input type="text" id="tim_b" placeholder="AWAY TEAM" class="p-4 bg-slate-700 rounded-2xl outline-none">
            <input type="text" id="tanggal" placeholder="TGL (12 Apr)" class="p-4 bg-slate-700 rounded-2xl outline-none">
            <input type="text" id="jam" placeholder="JAM (02:00)" class="p-4 bg-slate-700 rounded-2xl outline-none">
        </div>

        <div class="bg-slate-900/50 p-6 rounded-2xl border border-slate-700 mb-6">
            <p class="text-[10px] font-black text-slate-500 mb-4 uppercase tracking-widest">Bursa Asian Handicap</p>
            <div class="grid grid-cols-3 gap-3">
                <input type="text" id="h_home" placeholder="H Odds" class="p-3 bg-slate-800 rounded-xl text-center">
                <input type="text" id="h_val" placeholder="HDP (0:1/4)" class="p-3 bg-slate-800 rounded-xl text-center border border-sky-500/30">
                <input type="text" id="h_away" placeholder="A Odds" class="p-3 bg-slate-800 rounded-xl text-center">
            </div>
        </div>

        <div class="bg-slate-900/50 p-6 rounded-2xl border border-slate-700 mb-6">
            <p class="text-[10px] font-black text-slate-500 mb-4 uppercase tracking-widest">Bursa Over Under</p>
            <div class="grid grid-cols-3 gap-3">
                <input type="text" id="ou_o" placeholder="Over Odds" class="p-3 bg-slate-800 rounded-xl text-center">
                <input type="text" id="ou_t" placeholder="Total (3.5)" class="p-3 bg-slate-800 rounded-xl text-center border border-amber-500/30">
                <input type="text" id="ou_u" placeholder="Under Odds" class="p-3 bg-slate-800 rounded-xl text-center">
            </div>
        </div>

        <div class="flex gap-4 mb-8">
            <input type="text" id="prediksi" placeholder="Prediksi Skor (2-1)" class="flex-1 p-4 bg-slate-700 rounded-2xl border-2 border-sky-500 font-black text-center">
            <select id="status" class="p-4 bg-slate-700 rounded-2xl font-bold">
                <option value="UPCOMING">UPCOMING</option>
                <option value="LIVE">LIVE</option>
            </select>
        </div>

        <button onclick="saveMatch()" class="w-full py-5 bg-sky-500 text-slate-900 font-black rounded-2xl hover:bg-sky-400 transition-all shadow-lg shadow-sky-500/20">SAVE FIXTURE</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function saveMatch() {
            const data = {
                liga: document.getElementById('liga').value,
                tim_a: document.getElementById('tim_a').value,
                tim_b: document.getElementById('tim_b').value,
                tanggal: document.getElementById('tanggal').value,
                jam: document.getElementById('jam').value,
                hdp_home: document.getElementById('h_home').value,
                hdp_value: document.getElementById('h_val').value,
                hdp_away: document.getElementById('h_away').value,
                ou_over: document.getElementById('ou_o').value,
                ou_total: document.getElementById('ou_t').value,
                ou_under: document.getElementById('ou_u').value,
                prediksi: document.getElementById('prediksi').value,
                status: document.getElementById('status').value
            };

            const { error } = await _supabase.from('jadwal_bola').insert([data]);
            if (!error) { alert("Data Berhasil Disimpan!"); location.reload(); }
            else { alert("Gagal: " + error.message); }
        }
    </script>
</body>
</html>
