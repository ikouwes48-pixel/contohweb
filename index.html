<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIMASTORE — Premium Store Medan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: translateY(-10px); shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body>

<nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="text-2xl font-black tracking-tighter text-sky-600">DIMASTORE<span class="text-slate-900">.</span></div>
        <div class="flex gap-6 text-sm font-bold text-slate-600">
            <a href="#" class="hover:text-sky-600">Home</a>
            <a href="#" class="hover:text-sky-600">Catalog</a>
            <a href="https://wa.me/628xxxxxxxxxx" class="bg-sky-600 text-white px-5 py-2 rounded-full text-xs hover:bg-sky-500 transition">Contact Us</a>
        </div>
    </div>
</nav>

<header class="bg-slate-900 py-20 px-6 text-center text-white relative overflow-hidden">
    <div class="relative z-10">
        <h1 class="text-4xl md:text-6xl font-black mb-4 uppercase tracking-tight">Eksklusif & <span class="text-sky-400">Premium.</span></h1>
        <p class="text-slate-400 max-w-xl mx-auto font-medium">Temukan koleksi perlengkapan olahraga dan lifestyle terbaik hanya di DIMASTORE MEDAN.</p>
    </div>
    <div class="absolute top-0 left-0 w-64 h-64 bg-sky-500/10 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div>
</header>

<main class="max-w-7xl mx-auto px-6 py-16">
    <div class="flex items-center justify-between mb-12">
        <h2 class="text-2xl font-black uppercase tracking-tight italic border-l-4 border-sky-600 pl-4">New Arrivals</h2>
        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Showing all products</span>
    </div>

    <div id="product-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
        <div class="col-span-full text-center py-20 text-slate-400 font-bold animate-pulse">MEMUAT KATALOG...</div>
    </div>
</main>

<footer class="bg-white border-t border-slate-200 py-12 text-center">
    <div class="text-xl font-black text-slate-900 mb-2">DIMASTORE<span class="text-sky-600">.</span></div>
    <p class="text-slate-500 text-xs font-medium uppercase tracking-widest">© 2026 Dimastore Medan - Kualitas Premium Harga Terbaik</p>
</footer>

<script>
    const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadProducts() {
        const { data } = await _supabase.from('produk_dimastore').select('*').order('id', { ascending: false });
        const container = document.getElementById('product-container');
        container.innerHTML = "";

        data.forEach(p => {
            const formatHarga = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(p.harga);
            
            container.innerHTML += `
            <div class="product-card bg-white rounded-[2rem] border border-slate-100 overflow-hidden shadow-sm hover:shadow-xl">
                <div class="h-64 overflow-hidden relative group">
                    <img src="${p.gambar_url}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                    <div class="absolute top-4 left-4">
                        <span class="bg-sky-600 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase">${p.kategori}</span>
                    </div>
                </div>
                <div class="p-6 text-center">
                    <h3 class="font-bold text-slate-800 mb-2 text-lg uppercase tracking-tight">${p.nama_produk}</h3>
                    <p class="text-2xl font-black text-sky-600 mb-6">${formatHarga}</p>
                    <a href="${p.link_wa}" target="_blank" class="block w-full py-4 bg-slate-900 hover:bg-sky-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest transition-all">
                        BELI SEKARANG
                    </a>
                </div>
            </div>`;
        });
    }
    loadProducts();
</script>
</body>
</html>
