<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>DIMERLA Console | Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0f19; color: #fff; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); }
        input, select { background: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div id="auth" class="max-w-md mx-auto mt-20 glass-panel p-10 rounded-[3rem] text-center">
        <h2 class="text-3xl font-black mb-8 italic">DIMERLA<span class="text-[#0a7c5c]">.</span>CON</h2>
        <input type="password" id="pw" placeholder="Security Key" class="w-full p-4 rounded-2xl mb-4 text-center outline-none focus:ring-2 focus:ring-[#0a7c5c]">
        <button onclick="access()" class="w-full py-4 bg-white text-black font-black rounded-2xl tracking-tighter">INITIALIZE ACCESS</button>
    </div>

    <div id="dash" class="max-w-7xl mx-auto hidden">
        <div class="flex justify-between items-center mb-12">
            <h1 class="text-2xl font-black tracking-tighter uppercase">Merchant Console v2.0</h1>
            <div class="flex gap-4">
                <div id="status" class="flex items-center gap-2 text-[10px] font-bold text-[#0a7c5c]"><span class="w-2 h-2 bg-[#0a7c5c] rounded-full animate-pulse"></span> SYSTEM ONLINE</div>
            </div>
        </div>

        <div class="grid lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 glass-panel p-8 rounded-[2.5rem]">
                <h3 id="mode" class="text-xs font-black text-slate-500 uppercase tracking-widest mb-6">Create New Entry</h3>
                <input type="hidden" id="pid">
                <div class="space-y-4">
                    <input type="text" id="name" placeholder="Product Name" class="w-full p-4 rounded-xl outline-none">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="price" placeholder="Price" class="w-full p-4 rounded-xl outline-none">
                        <input type="number" id="stock" placeholder="Stock" class="w-full p-4 rounded-xl outline-none">
                    </div>
                    <select id="cat" class="w-full p-4 rounded-xl outline-none font-bold text-xs">
                        <option value="FASHION">FASHION</option>
                        <option value="ELECTRONIC">ELECTRONIC</option>
                        <option value="ACCESSORY">ACCESSORY</option>
                        <option value="EXCLUSIVE">EXCLUSIVE</option>
                    </select>
                    <input type="text" id="img" placeholder="Image URL" class="w-full p-4 rounded-xl outline-none">
                    <button onclick="commit()" class="w-full py-5 bg-[#0a7c5c] text-white font-bold rounded-2xl uppercase tracking-tighter shadow-lg shadow-[#0a7c5c]/20">Commit Transaction</button>
                    <button id="cancel" onclick="resetForm()" class="w-full text-[10px] font-bold opacity-30 hidden">CANCEL OPERATION</button>
                </div>
            </div>

            <div class="lg:col-span-8 glass-panel rounded-[2.5rem] overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-white/5 text-[10px] font-bold text-slate-500 uppercase tracking-widest">
                        <tr>
                            <th class="p-6">Asset</th>
                            <th>Status</th>
                            <th class="text-right p-6">Management</th>
                        </tr>
                    </thead>
                    <tbody id="logs"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function access() {
            if(document.getElementById('pw').value === 'dimas2026') {
                document.getElementById('auth').style.display = 'none';
                document.getElementById('dash').style.display = 'block';
                fetchLogs();
            } else { alert("ACCESS DENIED"); }
        }

        async function fetchLogs() {
            const { data } = await _supabase.from('produk_dimastore').select('*').order('id', { ascending: false });
            const list = document.getElementById('logs');
            list.innerHTML = "";
            data.forEach(d => {
                list.innerHTML += `
                <tr class="border-b border-white/5 hover:bg-white/5 transition">
                    <td class="p-6">
                        <div class="flex items-center gap-4">
                            <img src="${d.gambar_url}" class="w-10 h-10 rounded-lg object-cover">
                            <div>
                                <p class="font-bold text-sm">${d.nama_produk}</p>
                                <p class="text-[9px] opacity-40 uppercase">${d.kategori}</p>
                            </div>
                        </div>
                    </td>
                    <td class="text-xs font-bold ${d.stok < 5 ? 'text-red-500' : 'text-[#0a7c5c]'}">${d.stok} IN STOCK</td>
                    <td class="p-6 text-right space-x-4">
                        <button onclick="edit('${d.id}','${d.nama_produk}',${d.harga},${d.stok},'${d.kategori}','${d.gambar_url}')" class="text-xs font-bold text-blue-400">EDIT</button>
                        <button onclick="remove('${d.id}')" class="text-xs font-bold text-red-500">VOID</button>
                    </td>
                </tr>`;
            });
        }

        async function commit() {
            const id = document.getElementById('pid').value;
            const data = {
                nama_produk: document.getElementById('name').value,
                harga: document.getElementById('price').value,
                stok: document.getElementById('stock').value,
                kategori: document.getElementById('cat').value,
                gambar_url: document.getElementById('img').value,
                link_wa: "https://wa.me/6281334331776"
            };
            if(id) await _supabase.from('produk_dimastore').update(data).eq('id', id);
            else await _supabase.from('produk_dimastore').insert([data]);
            resetForm();
            alert("SYSTEM NOTIFIED: TRANSACTION SUCCESS");
        }

        async function remove(id) { if(confirm("VOID TRANSACTION?")) await _supabase.from('produk_dimastore').delete().eq('id', id); }

        function edit(id, n, h, s, c, i) {
            document.getElementById('pid').value = id;
            document.getElementById('name').value = n;
            document.getElementById('price').value = h;
            document.getElementById('stock').value = s;
            document.getElementById('cat').value = c;
            document.getElementById('img').value = i;
            document.getElementById('mode').innerText = "Update Existing Asset";
            document.getElementById('cancel').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('pid').value = "";
            document.getElementById('name').value = "";
            document.getElementById('price').value = "";
            document.getElementById('stock').value = "";
            document.getElementById('img').value = "";
            document.getElementById('mode').innerText = "Create New Entry";
            document.getElementById('cancel').classList.add('hidden');
        }

        _supabase.channel('logs').on('postgres_changes', { event: '*', schema: 'public', table: 'produk_dimastore' }, fetchLogs).subscribe();
    </script>
</body>
</html>
