<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin DIMERLA | Professional Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; background: #f1f5f9; }</style>
</head>
<body class="p-4 md:p-10">

    <div id="login-panel" class="max-w-md mx-auto mt-20 bg-white p-10 rounded-[2.5rem] shadow-2xl border border-white">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-[#0d1b2a]">DIMERLA <span class="text-[#0a7c5c]">ADMIN</span></h2>
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mt-2">Secure Access Only</p>
        </div>
        <div class="space-y-4">
            <input type="text" id="user" placeholder="Username" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-[#0a7c5c]">
            <input type="password" id="pass" placeholder="Password" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-[#0a7c5c]">
            <button onclick="login()" class="w-full py-4 bg-[#0a7c5c] text-white font-black rounded-2xl shadow-lg shadow-[#0a7c5c]/30 hover:scale-[1.02] transition">MASUK SEKARANG</button>
        </div>
    </div>

    <div id="main-panel" class="max-w-6xl mx-auto hidden">
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div>
                <h1 class="text-3xl font-black text-[#0d1b2a]">INVENTORY <span class="text-[#0a7c5c]">SYSTEM</span></h1>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Update Real-time tanpa refresh</p>
            </div>
            <button onclick="location.reload()" class="bg-red-50 text-red-600 px-6 py-2 rounded-full text-xs font-black border border-red-100 uppercase tracking-widest">Logout</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
                <h3 id="form-title" class="font-black text-sm text-slate-400 uppercase mb-6 tracking-widest">Tambah Produk</h3>
                <input type="hidden" id="edit-id">
                <div class="space-y-4">
                    <input type="text" id="nama" placeholder="Nama Barang" class="w-full p-4 bg-slate-50 rounded-xl outline-none border border-slate-100">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="harga" placeholder="Harga" class="w-full p-4 bg-slate-50 rounded-xl border border-slate-100">
                        <input type="number" id="stok" placeholder="Stok" class="w-full p-4 bg-slate-50 rounded-xl border border-slate-100 font-bold text-[#0a7c5c]">
                    </div>
                    <select id="kategori" class="w-full p-4 bg-slate-50 rounded-xl border border-slate-100 font-bold uppercase text-xs">
                        <option value="FASHION">FASHION</option>
                        <option value="ELEKTRONIK">ELEKTRONIK</option>
                        <option value="AKSESORIS">AKSESORIS</option>
                        <option value="JERSEY">JERSEY</option>
                    </select>
                    <input type="text" id="gambar" placeholder="Link Gambar URL" class="w-full p-4 bg-slate-50 rounded-xl border border-slate-100 text-xs">
                    <button id="btn-save" onclick="save()" class="w-full py-4 bg-[#0d1b2a] text-white font-black rounded-xl hover:bg-[#0a7c5c] transition uppercase text-xs tracking-widest">Simpan Barang</button>
                    <button id="btn-cancel" onclick="reset()" class="w-full text-[10px] font-black text-slate-300 hidden">BATALKAN EDIT</button>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex justify-between">
                    <h3 class="font-black text-sm text-slate-400 uppercase tracking-widest">History Update</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <tr>
                                <th class="p-6">Produk</th>
                                <th>Kategori</th>
                                <th>Stok</th>
                                <th class="text-right p-6">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-100">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function login() {
            if(document.getElementById('user').value === 'admin' && document.getElementById('pass').value === 'dimerla2026') {
                document.getElementById('login-panel').classList.add('hidden');
                document.getElementById('main-panel').classList.remove('hidden');
                refreshTable();
            } else { alert("Akses Ditolak!"); }
        }

        async function refreshTable() {
            const { data } = await _supabase.from('produk_dimastore').select('*').order('id', { ascending: false });
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = "";
            data.forEach(p => {
                tbody.innerHTML += `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-6 flex items-center gap-4">
                        <img src="${p.gambar_url}" class="w-12 h-12 rounded-xl object-cover shadow-sm bg-slate-100">
                        <span class="font-bold text-slate-700 text-sm">${p.nama_produk}</span>
                    </td>
                    <td class="text-[10px] font-black text-slate-400">${p.kategori}</td>
                    <td class="font-black text-[#0a7c5c]">${p.stok}</td>
                    <td class="p-6 text-right space-x-3">
                        <button onclick="prepareEdit('${p.id}', '${p.nama_produk}', ${p.harga}, ${p.stok}, '${p.kategori}', '${p.gambar_url}')" class="text-blue-500 font-black text-[10px]">EDIT</button>
                        <button onclick="del('${p.id}')" class="text-red-500 font-black text-[10px]">HAPUS</button>
                    </td>
                </tr>`;
            });
        }

        async function save() {
            const id = document.getElementById('edit-id').value;
            const obj = {
                nama_produk: document.getElementById('nama').value,
                harga: document.getElementById('harga').value,
                stok: document.getElementById('stok').value,
                kategori: document.getElementById('kategori').value,
                gambar_url: document.getElementById('gambar').value
            };

            if(id) await _supabase.from('produk_dimastore').update(obj).eq('id', id);
            else await _supabase.from('produk_dimastore').insert([obj]);
            
            reset();
            alert("Data tersimpan secara Real-time!");
        }

        async function del(id) {
            if(confirm("Hapus produk ini?")) await _supabase.from('produk_dimastore').delete().eq('id', id);
        }

        function prepareEdit(id, n, h, s, k, g) {
            document.getElementById('edit-id').value = id;
            document.getElementById('nama').value = n;
            document.getElementById('harga').value = h;
            document.getElementById('stok').value = s;
            document.getElementById('kategori').value = k;
            document.getElementById('gambar').value = g;
            document.getElementById('form-title').innerText = "Edit Barang";
            document.getElementById('btn-cancel').classList.remove('hidden');
        }

        function reset() {
            document.getElementById('edit-id').value = "";
            document.getElementById('nama').value = "";
            document.getElementById('harga').value = "";
            document.getElementById('stok').value = "";
            document.getElementById('gambar').value = "";
            document.getElementById('form-title').innerText = "Tambah Produk";
            document.getElementById('btn-cancel').classList.add('hidden');
        }

        _supabase.channel('inv').on('postgres_changes', { event: '*', schema: 'public', table: 'produk_dimastore' }, refreshTable).subscribe();
    </script>
</body>
</html>
