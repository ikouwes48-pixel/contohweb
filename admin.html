<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Prediksi Bola</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans">
    <div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-8">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
            <h2 class="text-xl font-bold mb-6 text-slate-800">Tambah Jadwal</h2>
            <div class="space-y-4">
                <input type="text" id="liga" placeholder="Nama Liga" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="timA" placeholder="Tim A" class="p-3 bg-slate-50 border border-slate-200 rounded-xl">
                    <input type="text" id="timB" placeholder="Tim B" class="p-3 bg-slate-50 border border-slate-200 rounded-xl">
                </div>
                <input type="text" id="jam" placeholder="Jam (Contoh: 21:00)" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl">
                <input type="text" id="prediksi" placeholder="Prediksi Skor" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl">
                <button id="btnSimpan" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all shadow-lg shadow-blue-200">Publikasikan</button>
            </div>
        </div>

        <div class="md:col-span-2">
            <h2 class="text-xl font-bold mb-6 text-slate-800 text-center md:text-left">Kelola Jadwal Aktif</h2>
            <div class="overflow-hidden rounded-2xl border border-slate-200 shadow-sm">
                <table class="w-full text-left bg-white border-collapse">
                    <thead class="bg-slate-50 text-slate-500 text-sm uppercase">
                        <tr>
                            <th class="p-4">Pertandingan</th>
                            <th class="p-4">Skor</th>
                            <th class="p-4 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fungsi Load Data untuk Admin
        async function loadAdminData() {
            const { data, error } = await _supabase.from('jadwal_bola').select('*').order('id', { ascending: false });
            if (error) return;

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-4 text-sm font-medium">
                        <div class="text-blue-600 text-xs font-bold">${item.liga}</div>
                        ${item.tim_a} vs ${item.tim_b}
                    </td>
                    <td class="p-4 font-mono font-bold text-green-600">${item.prediksi}</td>
                    <td class="p-4 text-center">
                        <button onclick="hapusData(${item.id})" class="text-red-500 hover:bg-red-50 p-2 rounded-lg transition-all">🗑️ Hapus</button>
                    </td>
                </tr>
            `).join('');
        }

        // Fungsi Tambah Data
        document.getElementById('btnSimpan').addEventListener('click', async () => {
            const payload = {
                liga: document.getElementById('liga').value,
                tim_a: document.getElementById('timA').value,
                tim_b: document.getElementById('timB').value,
                jam: document.getElementById('jam').value,
                prediksi: document.getElementById('prediksi').value
            };

            const { error } = await _supabase.from('jadwal_bola').insert([payload]);
            if (error) alert(error.message);
            else {
                alert("Data Ditambahkan!");
                document.querySelectorAll('input').forEach(i => i.value = '');
                loadAdminData();
            }
        });

        // Fungsi Hapus Data
        async function hapusData(id) {
            if (confirm('Yakin ingin menghapus jadwal ini?')) {
                const { error } = await _supabase.from('jadwal_bola').delete().eq('id', id);
                if (error) alert(error.message);
                else loadAdminData();
            }
        }

        loadAdminData();
    </script>
</body>
</html>
