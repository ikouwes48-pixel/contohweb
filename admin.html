<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin DIMASTORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 p-6 md:p-12">
    <div class="max-w-xl mx-auto bg-white p-10 rounded-[3rem] shadow-xl border border-slate-100">
        <h1 class="text-3xl font-black text-sky-600 mb-8 italic">ADD PRODUCT</h1>
        
        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Nama Barang</label>
                <input type="text" id="nama" placeholder="Contoh: Jersey Timnas 2024" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Harga (Angka saja)</label>
                <input type="number" id="harga" placeholder="Contoh: 150000" class="w-full p-4 bg-slate-100 rounded-2xl outline-none">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">URL Foto Produk</label>
                <input type="text" id="gambar" placeholder="Tempel link foto di sini" class="w-full p-4 bg-slate-100 rounded-2xl outline-none">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Kategori</label>
                <select id="kategori" class="w-full p-4 bg-slate-100 rounded-2xl outline-none font-bold">
                    <option value="Jersey">JERSEY</option>
                    <option value="Sepatu">SEPATU</option>
                    <option value="Aksesoris">AKSESORIS</option>
                </select>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Link WhatsApp</label>
                <input type="text" id="wa" placeholder="https://wa.me/62812xxx" class="w-full p-4 bg-slate-100 rounded-2xl outline-none">
            </div>

            <button onclick="uploadProduk()" class="w-full py-5 bg-sky-600 hover:bg-slate-900 text-white font-black rounded-3xl transition-all shadow-lg shadow-sky-500/20 uppercase mt-4">Simpan ke Toko</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function uploadProduk() {
            const payload = {
                nama_produk: document.getElementById('nama').value,
                harga: document.getElementById('harga').value,
                gambar_url: document.getElementById('gambar').value,
                kategori: document.getElementById('kategori').value,
                link_wa: document.getElementById('wa').value
            };

            const { error } = await _supabase.from('produk_dimastore').insert([payload]);
            if(!error) { alert("Produk Berhasil Ditambahkan!"); location.reload(); }
            else { alert("Error: " + error.message); }
        }
    </script>
</body>
</html>
