<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - DIMERLA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-200 p-6 md:p-12">
    <div class="max-w-3xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black italic text-sky-500">ADMIN CONTROL</h1>
            <a href="index.html" target="_blank" class="text-[10px] font-bold border border-slate-700 px-4 py-2 rounded-full hover:bg-slate-800">VIEW WEBSITE</a>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-8 rounded-[2.5rem] shadow-2xl">
            <div class="grid grid-cols-2 gap-4 mb-8">
                <input type="text" id="liga" placeholder="LIGA (Premier League)" class="col-span-2 p-4 bg-slate-800 rounded-2xl outline-none focus:ring-2 focus:ring-sky-500 border border-white/5">
                <input type="text" id="tim_a" placeholder="HOME TEAM" class="p-4 bg-slate-800 rounded-2xl outline-none border border-white/5">
                <input type="text" id="tim_b" placeholder="AWAY TEAM" class="p-4 bg-slate-800 rounded-2xl outline-none border border-white/5">
                <input type="text" id="tanggal" placeholder="TGL (12 Apr)" class="p-4 bg-slate-800 rounded-2xl outline-none border border-white/5">
                <input type="text" id="jam" placeholder="JAM (02:00)" class="p-4 bg-slate-800 rounded-2xl outline-none border border-white/5">
            </div>

            <div class="space-y-6 mb-8">
                <div class="bg-slate-950/50 p-6 rounded-3xl border border-white/5">
                    <p class="text-[10px] font-black text-slate-500 mb-4 uppercase tracking-widest">Asian Handicap Markets</p>
                    <div class="grid grid-cols-3 gap-4">
                        <input type="text" id="h_home" placeholder="Home Odds" class="p-3 bg-slate-800 rounded-xl text-center">
                        <input type="text" id="h_val" placeholder="Handicap (0:1/4)" class="p-3 bg-slate-800 rounded-xl text-center border border-sky-500/20 font-bold">
                        <input type="text" id="h_away" placeholder="Away Odds" class="p-3 bg-slate-800 rounded-xl text-center">
                    </div>
                </div>

                <div class="bg-slate-950/50 p-6 rounded-3xl border border-white/5">
                    <p class="text-[10px] font-black text-slate-500 mb-4 uppercase tracking-widest">Over Under Markets</p>
                    <div class="grid grid-cols-3 gap-4">
                        <input type="text" id="ou_o" placeholder="Over Odds" class="p-3 bg-slate-800 rounded-xl text-center">
                        <input type="text" id="ou_t" placeholder="Total (2.5)" class="p-3 bg-slate-800 rounded-xl text-center border border-amber-500/20 font-bold">
                        <input type="text" id="ou_u" placeholder="Under Odds" class="p-3 bg-slate-800 rounded-xl text-center">
                    </div>
                </div>
            </div>

            <div class="flex gap-4 mb-10">
                <input type="text" id="prediksi" placeholder="Prediksi (2-1)" class="flex-1 p-5 bg-sky-500/10 border-2 border-sky-500 rounded-2xl font-black text-center text-sky-400">
                <select id="status" class="p-5 bg-slate-800 rounded-2xl font-bold border border-white/5">
                    <option value="UPCOMING">UPCOMING</option>
                    <option value="LIVE">LIVE</option>
                </select>
            </div>

            <button onclick="saveMatch()" class="w-full py-5 bg-sky-600 hover:bg-sky-500 text-white font-black rounded-3xl transition-all shadow-xl shadow-sky-900/20 uppercase tracking-widest">Publish Analysis</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function saveMatch() {
            const payload = {
                liga: document.getElementById('liga').value,
                tim_a: document.getElementById('tim_a').value,
                tim_b: document.getElementById('tim_b').value,
                tanggal: document.getElementById('tanggal').value,
                jam: document.getElementById('jam').value,
                hdp_home: document.getElementById('h_home').value,
                hdp_value: document.getElementById('h_val').value,
                hdp_away: document.getElementById('h_away').value,
                ou_over: document.getElementById('ou_o').value,
                ou_total: document.getElementById('ou_t').value,
                ou_under: document.getElementById('ou_u').value,
                prediksi: document.getElementById('prediksi').value,
                status: document.getElementById('status').value
            };

            const { error } = await _supabase.from('jadwal_bola').insert([payload]);
            if(!error) { alert("Match Published!"); location.reload(); }
            else { alert("Error: " + error.message); }
        }
    </script>
</body>
</html>
