<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Super Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <div id="login-section" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border">
            <h2 class="text-2xl font-bold mb-6 text-center italic">ADMIN ACCESS</h2>
            <input type="text" id="userid" placeholder="User ID" class="w-full p-3 mb-4 bg-slate-50 border rounded-xl outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-4 bg-slate-50 border rounded-xl outline-none">
            <button id="btnLogin" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl">MASUK</button>
        </div>
    </div>

    <div id="admin-section" class="hidden p-4 md:p-8">
        <div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border h-fit">
                <h2 id="form-title" class="text-lg font-bold mb-6 text-blue-600">Tambah Jadwal</h2>
                <input type="hidden" id="edit-id">
                <div class="space-y-4">
                    <input type="text" id="liga" placeholder="Liga" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                    <input type="text" id="logo_url" placeholder="URL Logo (Opsional)" class="w-full p-3 bg-slate-50 border rounded-xl outline-none text-xs">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="timA" placeholder="Tim A" class="p-3 bg-slate-50 border rounded-xl">
                        <input type="text" id="timB" placeholder="Tim B" class="p-3 bg-slate-50 border rounded-xl">
                    </div>
                    <select id="status" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                        <option value="UPCOMING">UPCOMING</option>
                        <option value="LIVE">LIVE (Berkedip)</option>
                        <option value="FINISHED">FINISHED</option>
                    </select>
                    <input type="text" id="jam" placeholder="Jam" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                    <input type="text" id="prediksi" placeholder="Prediksi Skor" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                    <button id="btnSimpan" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg transition-all">SIMPAN DATA</button>
                    <button id="btnBatal" onclick="resetForm()" class="hidden w-full py-2 bg-slate-200 text-slate-600 rounded-xl mt-2">Batal Edit</button>
                </div>
                <button onclick="logout()" class="w-full mt-10 py-2 text-red-500 text-xs">Logout</button>
            </div>

            <div class="md:col-span-2 overflow-hidden rounded-2xl border shadow-sm bg-white">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 text-slate-400 text-[10px] font-bold uppercase">
                        <tr><th class="p-4">Match</th><th class="p-4 text-center">Aksi</th></tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- LOGIN LOGIC ---
        document.getElementById('btnLogin').addEventListener('click', () => {
            if (document.getElementById('userid').value === "dimas_admin" && document.getElementById('password').value === "bola123") {
                sessionStorage.setItem("isLoggedIn", "true");
                checkSession();
            } else { alert("Salah!"); }
        });

        function checkSession() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                loadAdminData();
            }
        }

        function logout() { sessionStorage.removeItem("isLoggedIn"); location.reload(); }

        // --- DATA LOGIC ---
        async function loadAdminData() {
            const { data } = await _supabase.from('jadwal_bola').select('*').order('id', { ascending: false });
            document.getElementById('table-body').innerHTML = data.map(item => `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 text-sm font-medium">
                        <span class="text-[9px] px-2 py-0.5 bg-blue-100 text-blue-600 rounded">${item.status}</span><br>
                        ${item.tim_a} vs ${item.tim_b}
                    </td>
                    <td class="p-4 text-center flex gap-2 justify-center">
                        <button onclick='isiFormEdit(${JSON.stringify(item)})' class="text-blue-500 text-xs px-2 py-1 border border-blue-100 rounded">Edit</button>
                        <button onclick="hapusData(${item.id})" class="text-red-500 text-xs px-2 py-1 border border-red-100 rounded">Hapus</button>
                    </td>
                </tr>`).join('');
        }

        document.getElementById('btnSimpan').addEventListener('click', async () => {
            const payload = {
                liga: document.getElementById('liga').value,
                tim_a: document.getElementById('timA').value,
                tim_b: document.getElementById('timB').value,
                jam: document.getElementById('jam').value,
                prediksi: document.getElementById('prediksi').value,
                status: document.getElementById('status').value,
                logo_url: document.getElementById('logo_url').value
            };
            
            const editId = document.getElementById('edit-id').value;
            let res;
            
            if (editId) {
                res = await _supabase.from('jadwal_bola').update(payload).eq('id', editId);
            } else {
                res = await _supabase.from('jadwal_bola').insert([payload]);
            }

            if (res.error) alert(res.error.message);
            else { resetForm(); loadAdminData(); }
        });

        function isiFormEdit(item) {
            document.getElementById('edit-id').value = item.id;
            document.getElementById('liga').value = item.liga;
            document.getElementById('timA').value = item.tim_a;
            document.getElementById('timB').value = item.tim_b;
            document.getElementById('jam').value = item.jam;
            document.getElementById('prediksi').value = item.prediksi;
            document.getElementById('status').value = item.status;
            document.getElementById('logo_url').value = item.logo_url || '';
            document.getElementById('form-title').innerText = "Edit Jadwal";
            document.getElementById('btnBatal').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            document.querySelectorAll('input').forEach(i => i.value = '');
            document.getElementById('form-title').innerText = "Tambah Jadwal";
            document.getElementById('btnBatal').classList.add('hidden');
        }

        async function hapusData(id) { if (confirm('Hapus?')) { await _supabase.from('jadwal_bola').delete().eq('id', id); loadAdminData(); } }

        checkSession();
    </script>
</body>
</html>
