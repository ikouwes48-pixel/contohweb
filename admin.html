<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | DIMERLA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-[#f8f9fa] p-6">
    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-black text-[#0d1b2a]">DIMERLA <span class="text-[#0a7c5c]">ADMIN</span></h1>
            <a href="index.html" class="text-xs font-bold bg-white border px-4 py-2 rounded-lg">LIHAT TOKO</a>
        </div>

        <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-[#e8edf2]">
            <div class="space-y-5">
                <div>
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Nama Produk</label>
                    <input type="text" id="nama" class="w-full p-4 bg-[#f8f9fa] border-none rounded-xl mt-1 focus:ring-2 focus:ring-[#0a7c5c] outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Harga (Angka)</label>
                        <input type="number" id="harga" class="w-full p-4 bg-[#f8f9fa] border-none rounded-xl mt-1 outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Kategori</label>
                        <select id="kategori" class="w-full p-4 bg-[#f8f9fa] border-none rounded-xl mt-1 outline-none font-bold text-[#0a7c5c]">
                            <option value="FASHION">FASHION</option>
                            <option value="ELEKTRONIK">ELEKTRONIK</option>
                            <option value="AKSESORIS">AKSESORIS</option>
                            <option value="KULINER">KULINER</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">URL Gambar (Unsplash/Google)</label>
                    <input type="text" id="gambar" class="w-full p-4 bg-[#f8f9fa] border-none rounded-xl mt-1 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Link WhatsApp (wa.me/...)</label>
                    <input type="text" id="wa" value="https://wa.me/6281334331776" class="w-full p-4 bg-[#f8f9fa] border-none rounded-xl mt-1 outline-none">
                </div>
                <button onclick="simpanProduk()" class="w-full py-5 bg-[#0a7c5c] text-white font-black rounded-2xl hover:bg-[#0d1b2a] transition-all uppercase tracking-widest mt-4">Upload ke Toko</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function simpanProduk() {
            const p = {
                nama_produk: document.getElementById('nama').value,
                harga: document.getElementById('harga').value,
                kategori: document.getElementById('kategori').value,
                gambar_url: document.getElementById('gambar').value,
                link_wa: document.getElementById('wa').value
            };

            const { error } = await _supabase.from('produk_dimastore').insert([p]);
            if (!error) {
                alert("Berhasil! Barang sudah tampil di DIMERLA.");
                location.reload();
            } else {
                alert("Error: " + error.message);
            }
        }
    </script>
</body>
</html>
