<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin DIMERLA | Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-[#f8f9fa] p-6">
    <div class="max-w-xl mx-auto">
        <div class="flex items-center gap-4 mb-8">
            <div class="w-12 h-12 bg-[#0a7c5c] rounded-2xl flex items-center justify-center text-white font-black">D</div>
            <h1 class="text-2xl font-black text-[#0d1b2a]">MANAGE <span class="text-[#0a7c5c]">STORES</span></h1>
        </div>

        <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm">
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Nama Barang</label>
                    <input type="text" id="nama" class="w-full p-4 bg-[#f8f9fa] rounded-xl mt-1 outline-none focus:ring-2 focus:ring-[#0a7c5c]">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Harga</label>
                        <input type="number" id="harga" placeholder="150000" class="w-full p-4 bg-[#f8f9fa] rounded-xl mt-1 outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Stok Awal</label>
                        <input type="number" id="stok" placeholder="50" class="w-full p-4 bg-[#f8f9fa] rounded-xl mt-1 outline-none border border-[#0a7c5c]/30 font-bold">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Kategori</label>
                    <select id="kategori" class="w-full p-4 bg-[#f8f9fa] rounded-xl mt-1 outline-none font-bold">
                        <option value="FASHION">FASHION</option>
                        <option value="ELEKTRONIK">ELEKTRONIK</option>
                        <option value="AKSESORIS">AKSESORIS</option>
                        <option value="KULINER">KULINER</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Link Gambar</label>
                    <input type="text" id="gambar" placeholder="https://link-foto.com/gambar.jpg" class="w-full p-4 bg-[#f8f9fa] rounded-xl mt-1 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Link WhatsApp</label>
                    <input type="text" id="wa" value="https://wa.me/6281334331776" class="w-full p-4 bg-[#f8f9fa] rounded-xl mt-1 outline-none text-xs">
                </div>
                <button onclick="save()" class="w-full py-5 bg-[#0a7c5c] text-white font-black rounded-2xl hover:bg-[#0d1b2a] transition-all uppercase tracking-widest mt-4">Simpan Produk</button>
            </div>
        </div>
        <p class="text-center text-[10px] text-slate-400 mt-8 font-bold uppercase tracking-widest">DIMERLA GLOBAL MEDIA — ADMIN PANEL</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://clbcalmyotcbxiocorys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYmNhbG15b3RjYnhpb2NvcnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDgyNTksImV4cCI6MjA5MTEyNDI1OX0.IzEWTUcPCr4t-ZTqvPCqShE2BwRxvBFW1grJvggMhJM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function save() {
            const item = {
                nama_produk: document.getElementById('nama').value,
                harga: document.getElementById('harga').value,
                stok: document.getElementById('stok').value,
                kategori: document.getElementById('kategori').value,
                gambar_url: document.getElementById('gambar').value,
                link_wa: document.getElementById('wa').value
            };

            const { error } = await _supabase.from('produk_dimastore').insert([item]);
            if (!error) {
                alert("Sukses! Produk ditambahkan.");
                location.reload();
            } else {
                alert("Gagal: " + error.message);
            }
        }
    </script>
</body>
</html>
